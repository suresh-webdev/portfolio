<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="XQ72UO3s0muIsvOu26jJ3DtxVQpzbdYiULwlLOr-lK8" />

    <!-- Description, robots, og:title/description and the favicon link are
         injected at build time by the figma-site-configuration Vite plugin,
         sourced from .figma/make/site.json — keep that file as the source of
         truth for those instead of duplicating them here. -->
    <!-- Fonts are self-hosted and preloaded. They used to come from Google
         Fonts, which meant the hero — held invisible until the display face
         resolved — could show nothing at all for up to 1.2s on a cold load:
         DNS, TLS and a stylesheet round-trip to fonts.googleapis.com, then a
         second hop to fonts.gstatic.com before the first glyph existed.
         Three latin-subset files at the only weights the page actually uses
         (display 900, body 400, mono 400) total ~59KB and start downloading
         with the document itself. The @font-face rules are in index.css. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/barlow-condensed-900.woff2"
      crossorigin
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-400.woff2"
      crossorigin
    />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Suresh S — Full-Stack Engineer</title>
    <meta name="author" content="Suresh S" />
    <meta name="theme-color" content="#0c0c0b" />

    <!-- The canonical live URL. Deploying via GitHub Pages puts this at a
         path (/portfolio/), not the domain root, and that path is baked in
         here rather than left to resolve relatively: og:image in particular
         has to be a fully-qualified URL for Facebook and LinkedIn's crawlers
         to fetch it reliably — a root-relative path is not guaranteed to
         resolve against the right origin the way it does in a browser. -->
    <link rel="canonical" href="https://suresh-webdev.github.io/portfolio/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Suresh S" />
    <meta property="og:url" content="https://suresh-webdev.github.io/portfolio/" />
    <!-- Without these a share of this site rendered as a blank card — the one
         place the work is judged before anyone sees a pixel of it. The image
         is generated from the site's own type, palette and lattice. -->
    <meta property="og:image" content="https://suresh-webdev.github.io/portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Suresh S — Full-Stack Engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://suresh-webdev.github.io/portfolio/og.png" />
    <meta name="twitter:title" content="Suresh S — Full-Stack Engineer" />
    <meta
      name="twitter:description"
      content="Suresh S — full-stack engineer. I build what powers the product and what people experience."
    />

    <!-- Structured data. The page is client-rendered, so the HTML a crawler
         first receives is an empty <div id="root">; this is the one part of
         the document that states who the site is about without waiting for
         JavaScript. `sameAs` is what ties this page to the GitHub and
         LinkedIn profiles as one identity rather than three unrelated URLs. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Suresh S",
        "url": "https://suresh-webdev.github.io/portfolio/",
        "jobTitle": "Full-Stack Engineer",
        "description": "Full-stack engineer. I build what powers the product and what people experience.",
        "knowsAbout": [
          "Node.js",
          "Python",
          "React",
          "AWS",
          "API design",
          "Distributed systems",
          "Infrastructure as code"
        ],
        "sameAs": [
          "https://github.com/suresh-webdev",
          "https://linkedin.com/in/s-u-r-e-s-h"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Suresh S — Full-Stack Engineer. I build what powers the product and what people experience.
      Contact: sureshs.professional.career@gmail.com
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
